<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 236" width="614" height="236" role="img" aria-label="Terminal session comparing deterministic and randomized quick sort"><title>Deterministic quick sort degrades to 961 ms on sorted input. Randomized quick sort holds at 6 ms.</title><style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
      "DejaVu Sans Mono",monospace;font-size:12.5px}
    .frame{fill:none;stroke:#d0d7de}
