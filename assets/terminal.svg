    @media (prefers-color-scheme:dark){
      .frame,.chrome-rule,.rule{stroke:#30363d}
      .cmd,.chrome,.cursor{fill:#6e7781}
      .line{fill:#8b949e}
      .hi{fill:#e6edf3}
