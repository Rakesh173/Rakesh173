name: Spec card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/spec_card.py

      - name: Commit if anything moved
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/spec-card.svg
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh the spec card"
            git push
          fi
